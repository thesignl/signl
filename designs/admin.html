<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNL Admin — Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── Inherited from SIGNL reader-facing tokens ── */
  --ink:#0f0f0e;--ink-2:#2a2a28;--ink-3:#4a4a47;--ink-4:#7a7a76;--ink-5:#b0b0ab;
  --paper:#f7f5f0;--paper-2:#efece5;--paper-3:#e5e1d8;--paper-4:#d4cfc3;--white:#ffffff;
  --accent:#c8392b;--accent-2:#e8503f;--accent-soft:#fbeae7;
  --accent-blue:#1a3a5c;--accent-blue-soft:#e8eef5;
  --accent-green:#1a6b3c;--accent-green-soft:#e6f1ec;
  --accent-amber:#b8860b;--accent-amber-soft:#fbf4dc;
  --accent-violet:#5b2fa0;--accent-violet-soft:#efe9f9;
  /* ── Admin-only neutrals ── */
  --admin-bg:#fafaf7;
  --admin-card:#ffffff;
  --admin-border:#ebe7dd;
  --admin-border-strong:#d9d4c6;
  --admin-row-hover:#f5f2ea;
  /* ── Type ── */
  --serif:'Libre Baskerville',Georgia,serif;
  --sans:'Source Sans 3','Helvetica Neue',system-ui,sans-serif;
  --mono:'IBM Plex Mono','Courier New',monospace;
  --sidebar-w:240px;
  --topbar-h:56px;
}
html{font-size:14px}
body{font-family:var(--sans);background:var(--admin-bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit;text-decoration:none}

/* ═══ APP SHELL ═══ */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}

/* ═══ SIDEBAR ═══ */
.sidebar{background:var(--ink);color:var(--paper-2);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1)}
.sb-brand{padding:18px 22px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between}
.sb-logo{font-family:var(--serif);font-size:22px;font-weight:700;color:#fff;letter-spacing:-.01em}
.sb-logo span{color:var(--accent)}
.sb-env{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);padding:3px 7px;border:1px solid rgba(255,255,255,.15);border-radius:3px}
.sb-group{padding:18px 0 6px}
.sb-group-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.32);padding:0 22px;margin-bottom:6px}
.sb-link{display:flex;align-items:center;gap:11px;padding:8px 22px;color:rgba(255,255,255,.62);font-size:13.5px;cursor:pointer;transition:all .12s;position:relative;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.sb-link:hover{color:#fff;background:rgba(255,255,255,.04)}
.sb-link.active{color:#fff;background:rgba(255,255,255,.06)}
.sb-link.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.sb-icon{width:15px;height:15px;flex-shrink:0;opacity:.85}
.sb-count{margin-left:auto;font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.4);background:rgba(255,255,255,.05);padding:1px 6px;border-radius:8px}
.sb-link.active .sb-count{color:var(--accent-2);background:rgba(200,57,43,.15)}
.sb-footer{margin-top:auto;padding:16px 22px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.sb-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12px;flex-shrink:0}
.sb-user{flex:1;min-width:0}
.sb-user-name{font-size:12.5px;color:#fff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-role{font-family:var(--mono);font-size:9.5px;color:rgba(255,255,255,.4);letter-spacing:.06em;text-transform:uppercase}

/* ═══ MAIN ═══ */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:var(--topbar-h);background:var(--admin-card);border-bottom:1px solid var(--admin-border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:18px;flex:1;min-width:0}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-4);text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap}
.crumb .sep{color:var(--ink-5);opacity:.5}
.crumb .current{color:var(--ink)}
.search-shell{position:relative;flex:1;max-width:420px}
.search-input{width:100%;padding:8px 12px 8px 34px;background:var(--paper-2);border:1px solid transparent;border-radius:6px;font-size:13px;color:var(--ink);transition:all .12s}
.search-input:focus{outline:none;background:#fff;border-color:var(--admin-border-strong)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-4)}
.search-kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--ink-4);background:#fff;border:1px solid var(--admin-border);padding:1px 5px;border-radius:3px}
.topbar-right{display:flex;align-items:center;gap:8px}
.tb-icon-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--ink-4);border-radius:6px;transition:all .12s;position:relative}
.tb-icon-btn:hover{background:var(--paper-2);color:var(--ink)}
.tb-dot{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tb-divider{width:1px;height:22px;background:var(--admin-border);margin:0 4px}
.tb-btn-primary{background:var(--ink);color:#fff;padding:7px 14px;border-radius:6px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .12s}
.tb-btn-primary:hover{background:var(--ink-2)}

/* ═══ CONTENT ═══ */
.content{padding:28px;flex:1}
.page{display:none}
.page.active{display:block}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:24px;flex-wrap:wrap}
.page-title{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.01em;margin-bottom:4px}
.page-sub{font-size:13.5px;color:var(--ink-4);line-height:1.55;max-width:600px}
.page-actions{display:flex;gap:8px;flex-shrink:0}

/* ═══ BUTTONS ═══ */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;font-size:12.5px;font-weight:500;border-radius:6px;transition:all .12s;border:1px solid transparent;line-height:1;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-2)}
.btn-ink{background:var(--ink);color:#fff}
.btn-ink:hover{background:var(--ink-2)}
.btn-ghost{background:transparent;border-color:var(--admin-border);color:var(--ink-3)}
.btn-ghost:hover{border-color:var(--admin-border-strong);color:var(--ink);background:#fff}
.btn-danger{background:transparent;border-color:var(--admin-border);color:var(--accent)}
.btn-danger:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:5px 10px;font-size:11.5px}
.btn-lg{padding:11px 22px;font-size:13.5px}

/* ═══ CARDS ═══ */
.card{background:var(--admin-card);border:1px solid var(--admin-border);border-radius:8px}
.card-head{padding:16px 20px;border-bottom:1px solid var(--admin-border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-title{font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
.card-title-sub{font-family:var(--mono);font-size:10px;color:var(--ink-4);letter-spacing:.05em;text-transform:uppercase;font-weight:400}
.card-body{padding:20px}
.card-foot{padding:12px 20px;border-top:1px solid var(--admin-border);display:flex;align-items:center;justify-content:space-between;background:var(--paper-2)}

/* ═══ KPI ═══ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi{background:var(--admin-card);border:1px solid var(--admin-border);border-radius:8px;padding:18px 20px;position:relative}
.kpi-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.kpi-value{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--ink);line-height:1;margin-bottom:8px;letter-spacing:-.01em}
.kpi-delta{font-family:var(--mono);font-size:11px;display:inline-flex;align-items:center;gap:4px}
.kpi-delta.up{color:var(--accent-green)}
.kpi-delta.dn{color:var(--accent)}
.kpi-delta.flat{color:var(--ink-4)}
.kpi-spark{position:absolute;right:18px;bottom:18px;opacity:.6}

/* ═══ STATUS PILLS (canonical) ═══ */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:500;line-height:1.4;border:1px solid transparent;white-space:nowrap}
.pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block}
.pill-draft{background:var(--paper-2);color:var(--ink-4);border-color:var(--admin-border)}
.pill-review{background:var(--accent-amber-soft);color:var(--accent-amber);border-color:#f0e0a8}
.pill-scheduled{background:var(--accent-blue-soft);color:var(--accent-blue);border-color:#c5d4e3}
.pill-published{background:var(--accent-green-soft);color:var(--accent-green);border-color:#c0dccc}
.pill-archived{background:var(--paper-3);color:var(--ink-4);border-color:var(--paper-4)}
.pill-pro{background:var(--accent-soft);color:var(--accent);border-color:#f0c7c0;font-weight:600}
.pill-free{background:var(--accent-green-soft);color:var(--accent-green);border-color:#c0dccc}

/* ═══ DEPTH CHIPS ═══ */
.depth-chips{display:inline-flex;gap:3px}
.depth-chip{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;line-height:1.4;border:1px solid;background:#fff}
.depth-chip.summary{color:var(--accent-blue);border-color:#c5d4e3;background:var(--accent-blue-soft)}
.depth-chip.article{color:var(--accent-green);border-color:#c0dccc;background:var(--accent-green-soft)}
.depth-chip.analysis{color:var(--accent);border-color:#f0c7c0;background:var(--accent-soft)}
.depth-chip.off{color:var(--ink-5);border-color:var(--admin-border);background:transparent;opacity:.4}

/* ═══ TABLES ═══ */
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table thead th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);font-weight:500;padding:10px 16px;border-bottom:1px solid var(--admin-border);background:var(--paper-2);white-space:nowrap;position:sticky;top:0;z-index:5}
.table tbody td{padding:12px 16px;border-bottom:1px solid var(--admin-border);vertical-align:top}
.table tbody tr{transition:background .1s}
.table tbody tr:hover{background:var(--admin-row-hover)}
.table tbody tr:last-child td{border-bottom:none}
.table .col-checkbox{width:32px;padding-right:0}
.table .col-actions{width:60px;text-align:right;white-space:nowrap}
.table .col-num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
.table .row-headline{font-family:var(--serif);font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.35;margin-bottom:4px;max-width:480px}
.table .row-meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);letter-spacing:.02em;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.table .row-meta .sep{opacity:.4}
.checkbox{width:14px;height:14px;border:1.5px solid var(--admin-border-strong);border-radius:3px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;background:#fff;transition:all .12s;flex-shrink:0;vertical-align:middle}
.checkbox.checked{background:var(--ink);border-color:var(--ink)}
.checkbox.checked::after{content:'';width:6px;height:3px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(0,-1px)}

/* ═══ ROW ACTION MENU ═══ */
.row-menu{position:relative;display:inline-block}
.row-menu-trigger{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:var(--ink-4)}
.row-menu-trigger:hover{background:var(--paper-2);color:var(--ink)}
.row-menu-pop{display:none;position:absolute;right:0;top:30px;background:#fff;border:1px solid var(--admin-border);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.1);z-index:30;min-width:170px;padding:5px}
.row-menu.open .row-menu-pop{display:block}
.row-menu-item{display:flex;align-items:center;gap:9px;padding:7px 11px;font-size:12.5px;color:var(--ink-2);border-radius:4px;cursor:pointer;width:100%;background:none;border:none;text-align:left}
.row-menu-item:hover{background:var(--paper-2)}
.row-menu-item.danger{color:var(--accent)}
.row-menu-item.danger:hover{background:var(--accent-soft)}
.row-menu-divider{height:1px;background:var(--admin-border);margin:5px 0}

/* ═══ FILTERS ═══ */
.filters{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--admin-border);background:var(--paper-2);flex-wrap:wrap}
.filter-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;background:#fff;border:1px solid var(--admin-border);border-radius:16px;font-family:var(--mono);font-size:11px;color:var(--ink-3);cursor:pointer;transition:all .12s}
.filter-chip:hover{border-color:var(--admin-border-strong);color:var(--ink)}
.filter-chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.filter-chip .count{opacity:.6;font-size:10px}
.filter-spacer{flex:1}
.filter-select{padding:5px 10px;background:#fff;border:1px solid var(--admin-border);border-radius:6px;font-size:12px;color:var(--ink-2);cursor:pointer;font-family:inherit}
.filter-select:hover{border-color:var(--admin-border-strong)}

/* ═══ FORMS ═══ */
.form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.form-label{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);font-weight:500}
.form-help{font-size:11.5px;color:var(--ink-4);line-height:1.5}
.form-input,.form-textarea,.form-select{padding:9px 12px;background:#fff;border:1px solid var(--admin-border);border-radius:6px;font-size:13.5px;color:var(--ink);transition:border-color .12s;width:100%}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--ink-3)}
.form-textarea{resize:vertical;min-height:80px;font-family:inherit}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.toggle{display:inline-flex;align-items:center;gap:9px;cursor:pointer}
.toggle-track{width:34px;height:19px;background:var(--admin-border-strong);border-radius:11px;position:relative;transition:background .15s}
.toggle-thumb{position:absolute;top:2px;left:2px;width:15px;height:15px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .15s}
.toggle.on .toggle-track{background:var(--accent)}
.toggle.on .toggle-thumb{transform:translateX(15px)}
.toggle-label{font-size:13px;color:var(--ink-2)}

/* ═══ INLINE EXPAND ═══ */
.inline-expand{background:var(--paper-2);padding:16px 20px;border-bottom:1px solid var(--admin-border)}
.inline-expand-grid{display:grid;grid-template-columns:1fr 240px;gap:24px}
.field-row{display:flex;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--admin-border);gap:14px}
.field-row:last-child{border-bottom:none}
.field-label{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4);width:120px;flex-shrink:0;padding-top:2px}
.field-value{color:var(--ink-2);flex:1;line-height:1.55}

/* ═══ DASHBOARD GRID ═══ */
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:18px}
.activity-feed{padding:6px 0}
.activity-item{display:flex;gap:11px;padding:11px 20px;border-bottom:1px solid var(--admin-border)}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:7px}
.activity-dot.published{background:var(--accent-green)}
.activity-dot.draft{background:var(--ink-5)}
.activity-dot.scheduled{background:var(--accent-blue)}
.activity-dot.user{background:var(--accent-violet)}
.activity-content{flex:1;min-width:0;font-size:13px;color:var(--ink-2);line-height:1.5}
.activity-content strong{font-weight:600;color:var(--ink)}
.activity-time{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);margin-top:3px}
.feed-list{padding:6px 0}
.feed-row{padding:12px 20px;border-bottom:1px solid var(--admin-border);display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .1s}
.feed-row:last-child{border-bottom:none}
.feed-row:hover{background:var(--admin-row-hover)}
.feed-rank{font-family:var(--mono);font-size:11px;color:var(--ink-5);width:18px;flex-shrink:0;letter-spacing:.04em}
.feed-row-body{flex:1;min-width:0}
.feed-row-headline{font-family:var(--serif);font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed-row-meta{font-family:var(--mono);font-size:10px;color:var(--ink-4)}
.feed-row-stat{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right;white-space:nowrap}
.feed-row-stat .lbl{display:block;font-size:9px;color:var(--ink-5);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

/* ═══ CHART (svg) ═══ */
.chart-card{padding:18px 20px}
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.chart-num{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ink)}
.chart-legend{display:flex;gap:14px;font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.legend-dot{width:8px;height:8px;border-radius:2px;display:inline-block}

/* ═══ HERO PLACEMENT ═══ */
.placement-grid{display:grid;grid-template-columns:1fr 320px;gap:20px}
.hero-preview{background:#fff;border:2px dashed var(--accent);border-radius:8px;padding:24px;min-height:280px}
.hero-prev-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.hero-prev-headline{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ink);line-height:1.2;margin-bottom:8px}
.hero-prev-deck{font-size:13px;color:var(--ink-3);line-height:1.6;margin-bottom:14px}
.hero-prev-meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);display:flex;gap:12px}
.slot{background:#fff;border:1px solid var(--admin-border);border-radius:6px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:grab}
.slot:active{cursor:grabbing}
.slot-num{font-family:var(--mono);font-size:11px;color:var(--ink-5);width:18px;flex-shrink:0}
.slot-body{flex:1;min-width:0}
.slot-headline{font-family:var(--serif);font-size:13px;font-weight:600;color:var(--ink);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2px}
.slot-meta{font-family:var(--mono);font-size:9.5px;color:var(--ink-4)}
.slot-handle{color:var(--ink-5);cursor:grab;line-height:0}

/* ═══ EMPTY STATE ═══ */
.empty{padding:60px 20px;text-align:center}
.empty-icon{font-size:32px;margin-bottom:14px;opacity:.4}
.empty-title{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);margin-bottom:5px}
.empty-text{font-size:13px;color:var(--ink-4);line-height:1.55;max-width:340px;margin:0 auto 18px}

/* ═══ TAG PILLS (categories/tags pages) ═══ */
.tag-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;background:#fff;border:1px solid var(--admin-border);border-radius:20px;font-size:12.5px;color:var(--ink-2)}
.tag-pill .tp-count{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);background:var(--paper-2);padding:1px 6px;border-radius:8px}
.tag-grid{display:flex;flex-wrap:wrap;gap:8px}

/* ═══ AVATAR ═══ */
.avatar{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12px;flex-shrink:0}
.av-1{background:linear-gradient(135deg,#1a3a5c,#2a5a8c)}
.av-2{background:linear-gradient(135deg,#1a6b3c,#2a8b5c)}
.av-3{background:linear-gradient(135deg,#b8860b,#d8a62b)}
.av-4{background:linear-gradient(135deg,#5b2fa0,#7b4fc0)}
.av-5{background:linear-gradient(135deg,#c8392b,#e8503f)}
.user-cell{display:flex;align-items:center;gap:10px}
.user-cell-name{font-size:13.5px;color:var(--ink);font-weight:500}
.user-cell-email{font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}

/* ═══ TOAST ═══ */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:11px;box-shadow:0 10px 40px rgba(0,0,0,.2);animation:toastIn .25s ease-out;border-left:3px solid var(--accent-green);min-width:260px}
.toast.danger{border-left-color:var(--accent)}
.toast.info{border-left-color:var(--accent-blue)}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ═══ MODAL ═══ */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,15,14,.65);z-index:300;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:10px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal-head{padding:18px 24px;border-bottom:1px solid var(--admin-border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink)}
.modal-close{color:var(--ink-4);font-size:22px;line-height:1;padding:4px}
.modal-close:hover{color:var(--ink)}
.modal-body{padding:22px 24px}
.modal-foot{padding:14px 24px;border-top:1px solid var(--admin-border);background:var(--paper-2);display:flex;justify-content:flex-end;gap:9px;border-radius:0 0 10px 10px}

/* ═══ TWO COL DETAIL ═══ */
.detail-grid{display:grid;grid-template-columns:1fr 320px;gap:20px}

/* ═══ SETTINGS ═══ */
.settings-row{display:grid;grid-template-columns:240px 1fr auto;gap:24px;padding:18px 20px;border-bottom:1px solid var(--admin-border);align-items:center}
.settings-row:last-child{border-bottom:none}
.settings-label{font-size:13.5px;font-weight:600;color:var(--ink)}
.settings-desc{font-size:12.5px;color:var(--ink-4);line-height:1.55;margin-top:2px}

/* ═══ RESPONSIVE ═══ */
@media (max-width:1100px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .dash-grid{grid-template-columns:1fr}
  .placement-grid{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
  .form-grid-3{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .form-grid-2,.form-grid-3{grid-template-columns:1fr}
  .content{padding:18px}
  .topbar{padding:0 16px}
  .search-shell{max-width:none}
}

const $ = id => document.getElementById(id);
const fmt = n => n >= 1000 ? (n/1000).toFixed(n>=10000?0:1)+'k' : String(n);
const pillFor = status => {
  const map = {DRAFT:'pill-draft', REVIEW:'pill-review', SCHEDULED:'pill-scheduled', PUBLISHED:'pill-published', ARCHIVED:'pill-archived'};
  const label = {DRAFT:'Draft', REVIEW:'In Review', SCHEDULED:'Scheduled', PUBLISHED:'Published', ARCHIVED:'Archived'}[status]||status;
  return `<span class="pill ${map[status]||'pill-draft'}">${label}</span>`;
};
const depthChipsHtml = (depths) => {
  const all = ['summary','article','analysis'];
  return `<div class="depth-chips">${all.map(d => {
    const on = depths.includes(d);
    return `<span class="depth-chip ${on ? d : 'off'}">${d.charAt(0).toUpperCase()+d.slice(1,1)+d.charAt(0)}</span>`;
  }).join('')}</div>`;
};
// readable single-letter depth chips
const depthChipsLetters = (depths) => {
  return `<div class="depth-chips" title="${depths.join(', ')}">${
    [['summary','S'],['article','A'],['analysis','D']].map(([key,letter]) =>
      `<span class="depth-chip ${depths.includes(key) ? key : 'off'}">${letter}</span>`
    ).join('')
  }</div>`;
};

function toast(msg, kind='success') {
  const wrap = $('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast ' + (kind === 'success' ? '' : kind);
  t.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span>${msg}</span>`;
  wrap.appendChild(t);
  setTimeout(()=> t.remove(), 3200);
}

function openModal(html) {
  $('modal').innerHTML = html;
  $('modalBg').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  $('modalBg').classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(()=> $('modal').innerHTML='', 200);
}

}

function filterArt(status) { articlesFilter.status = status; selectedArticles.clear(); renderArticles(); }
function filterArtCat(cat) { articlesFilter.category = cat; renderArticles(); }
function filterArtSearch(q) { articlesFilter.search = q; renderArticles(); }
function clearArtFilters() { articlesFilter = {status:'all',category:'all',search:''}; renderArticles(); }
function toggleSelect(id) { selectedArticles.has(id) ? selectedArticles.delete(id) : selectedArticles.add(id); renderArticles(); }
function toggleAll() {
  const filtered = ARTICLES.filter(a => articlesFilter.status==='all'||a.status===articlesFilter.status);
  if (selectedArticles.size === filtered.length) selectedArticles.clear();
  else filtered.forEach(a => selectedArticles.add(a.id));
  renderArticles();
}
function clearSelection() { selectedArticles.clear(); renderArticles(); }
function bulkAction(kind) {
  const n = selectedArticles.size;
  if (!n) return;
  const labels = {publish:'Publish', archive:'Archive', delete:'Delete'};
  if (kind === 'delete') {
    openModal(`
      <div class="modal-head"><div class="modal-title">Delete ${n} article${n>1?'s':''}?</div><button class="modal-close" onclick="closeModal()">×</button></div>
      <div class="modal-body"><p style="font-size:13.5px;color:var(--ink-3);line-height:1.6">This action is reversible for 30 days via the soft-delete recovery queue. After that, articles are permanently removed.</p></div>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="closeModal();toast('${n} article${n>1?'s':''} deleted','danger');selectedArticles.clear();renderArticles()">Delete ${n}</button></div>`);
    return;
  }
  toast(`${labels[kind]}d ${n} article${n>1?'s':''}`);
  selectedArticles.clear();
  renderArticles();
}
function toggleRowMenu(btn, id) {
  const menu = btn.closest('.row-menu');
  document.querySelectorAll('.row-menu').forEach(m => { if (m !== menu) m.classList.remove('open'); });
  menu.classList.toggle('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.row-menu')) document.querySelectorAll('.row-menu').forEach(m => m.classList.remove('open'));
});
function publishArticle(id) {
  const a = ARTICLES.find(x => x.id === id);
  if (!a) return;
  a.status = 'PUBLISHED';
  a.publishedAt = new Date().toISOString().slice(0,16).replace('T',' ');
  toast('Published');
  renderArticles();
}
function toggleHero(id) {
  const a = ARTICLES.find(x => x.id === id);
  if (!a) return;
  if (a.isHero) { a.isHero = false; toast('Removed from hero','info'); }
  else { ARTICLES.forEach(x => x.isHero = false); a.isHero = true; toast('Hero updated'); }
  renderArticles();
}
function confirmDelete(id) {
  const a = ARTICLES.find(x => x.id === id);

  openModal(`

}

function renderAnalytics() {
  const totalViews = ARTICLES.reduce((s,a)=>s+a.views,0);
  const totalBookmarks = ARTICLES.reduce((s,a)=>s+a.bookmarks,0);
  const totalCompletions = ARTICLES.reduce((s,a)=>s+a.completions,0);
  const completionRate = totalViews>0 ? (totalCompletions/totalViews*100).toFixed(1) : 0;
  // 14-day mock series
  const series = [2.8,3.1,3.4,3.0,3.6,4.2,3.9,4.4,4.8,5.1,4.7,5.4,5.8,6.1];
  const w=720, h=180, padL=24, padR=10, padT=12, padB=24;
  const max = Math.max(...series), min = Math.min(...series);
  const sx = i => padL+(i*(w-padL-padR))/(series.length-1);
  const sy = v => padT+(h-padT-padB)*(1-(v-min)/(max-min||1));
  const linePts = series.map((v,i)=>`${sx(i)},${sy(v)}`).join(' ');
  const areaPath = `M ${sx(0)},${h-padB} L ${linePts.split(' ').join(' L ')} L ${sx(series.length-1)},${h-padB} Z`;

  // top categories breakdown
  const catTotals = CATEGORIES.map(c => ({
    name: c.name,
    short: c.short,
    color: c.color,
    views: ARTICLES.filter(a=>a.categoryShort===c.short).reduce((s,a)=>s+a.views,0),
  })).sort((a,b)=>b.views-a.views);
  const maxCat = Math.max(...catTotals.map(c=>c.views), 1);

  $('content').innerHTML = `
  <div class="page active">
    <div class="page-head">
      <div>
        <h1 class="page-title">Analytics</h1>
        <p class="page-sub">Engagement across the platform. View counts buffered in Redis, flushed to Postgres every 60 seconds.</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-ghost">Last 14 days <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>
        <button class="btn btn-ghost">Export</button>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Total Views</div><div class="kpi-value">${fmt(totalViews)}</div><div class="kpi-delta up">▲ +24% vs prior 14d</div></div>
      <div class="kpi"><div class="kpi-label">Bookmarks</div><div class="kpi-value">${fmt(totalBookmarks)}</div><div class="kpi-delta up">▲ +18%</div></div>
      <div class="kpi"><div class="kpi-label">Completions</div><div class="kpi-value">${fmt(totalCompletions)}</div><div class="kpi-delta up">▲ +12%</div></div>
      <div class="kpi"><div class="kpi-label">Completion Rate</div><div class="kpi-value">${completionRate}%</div><div class="kpi-delta flat">— stable</div></div>
    </div>

    <div class="dash-grid" style="grid-template-columns:1fr">
      <div class="card chart-card">
        <div class="chart-head">
          <div>
            <div class="card-title-sub" style="margin-bottom:6px">Views — last 14 days</div>
            <div class="chart-num">${fmt(totalViews)}<span style="font-family:var(--mono);font-size:11px;color:var(--ink-4);margin-left:8px;font-weight:400">across all articles</span></div>
          </div>
        </div>
        <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:200px;display:block">
          <defs><linearGradient id="anaFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#c8392b" stop-opacity="0.18"/><stop offset="100%" stop-color="#c8392b" stop-opacity="0"/></linearGradient></defs>
          ${[0,1,2,3,4].map(i=>{const y=padT+(i*(h-padT-padB))/4;return `<line x1="${padL}" x2="${w-padR}" y1="${y}" y2="${y}" stroke="#ebe7dd" stroke-width="1" stroke-dasharray="2 4"/>`;}).join('')}
          <path d="${areaPath}" fill="url(#anaFill)"/>
          <polyline points="${linePts}" fill="none" stroke="#c8392b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          ${series.map((v,i)=>`<circle cx="${sx(i)}" cy="${sy(v)}" r="3" fill="#fff" stroke="#c8392b" stroke-width="1.8"/>`).join('')}
        </svg>
      </div>
    </div>

    <div class="dash-grid">
      <div class="card">
        <div class="card-head"><div class="card-title">Views by category <span class="card-title-sub">7-day</span></div></div>
        <div style="padding:18px 20px">
          ${catTotals.map(c=>`
            <div style="margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">
                <span style="font-weight:500;color:var(--ink-2)">${c.name}</span>
                <span style="font-family:var(--mono);color:var(--ink-3)">${fmt(c.views)}</span>
              </div>
              <div style="background:var(--paper-2);height:6px;border-radius:3px;overflow:hidden">
                <div style="height:100%;width:${(c.views/maxCat*100).toFixed(0)}%;background:var(--accent);border-radius:3px;transition:width .3s"></div>
              </div>
            </div>`).join('')}
        </div>
      </div>

      <div class="card">
        <div class="card-head"><div class="card-title">Top articles <span class="card-title-sub">by views</span></div></div>
        <div class="feed-list">
          ${[...ARTICLES].filter(a=>a.views>0).sort((a,b)=>b.views-a.views).slice(0,6).map((a,i)=>`
            <div class="feed-row" onclick="openArticleDetail('${a.id}')">
              <div class="feed-rank">0${i+1}</div>
              <div class="feed-row-body">
                <div class="feed-row-headline">${a.headline}</div>
                <div class="feed-row-meta">${a.category} · ${a.author}</div>
              </div>
              <div class="feed-row-stat">${fmt(a.views)}<span class="lbl">views</span></div>
            </div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}
